name: Bridge checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:mod
      - run: npm run test:installer
      # The actual game Mod requires the user's local game assemblies.
      # Game binaries and saves are never uploaded to this workflow.
