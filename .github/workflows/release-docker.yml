name: Prepare Docker release assets
on:
  workflow_dispatch:
    inputs:
      release_id:
        description: 'Existing draft prerelease ID (never publishes it)'
        required: true
        type: string
      source_commit:
        description: 'Full code commit to build'
        required: true
        type: string
permissions:
  contents: read
jobs:
  docker-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        target: [bridge-runtime, game-runtime, mod-build]
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_ID: ${{ inputs.release_id }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      TARGET: ${{ matrix.target }}
    steps:
      - name: Validate draft destination and source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]
          [[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          gh api "repos/$GH_REPO/releases/$RELEASE_ID" > "$RUNNER_TEMP/destination.json"
          jq -e '.draft == true and .prerelease == true and (.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-preview\\.[0-9]+$"))' "$RUNNER_TEMP/destination.json" > /dev/null
          echo "RELEASE_TAG=$(jq -r .tag_name "$RUNNER_TEMP/destination.json")" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_commit }}
      - uses: actions/checkout@v7
        if: matrix.target == 'game-runtime'
        with:
          ref: ${{ github.sha }}
          path: release-tools
      - name: Build and export one image (no proprietary inputs)
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p 'require("./package.json").version')
          test "v$version" = "$RELEASE_TAG"
          image="local/stardew-agent-bridge:$TARGET"
          versioned="local/stardew-agent-bridge:$version-$TARGET"
          file=docker/Dockerfile
          extra=(--target "$TARGET")
          if [ "$TARGET" = mod-build ]; then file=docker/Dockerfile.mod-build; extra=(); fi
          docker build --platform linux/amd64 -f "$file" "${extra[@]}" --tag "$image" \
            --build-arg "SAB_SOURCE_COMMIT=$SOURCE_COMMIT" --build-arg SAB_WORKTREE_DIRTY=false \
            --build-arg "SAB_BUILD_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)" .
          docker tag "$image" "$versioned"
          archive="$RUNNER_TEMP/StardewAgentBridge-$version-docker-$TARGET-amd64.tar.gz"
          docker save "$image" "$versioned" | gzip -6 > "$archive"
          gzip -t "$archive"
          docker image inspect "$image" > "$RUNNER_TEMP/image-inspect.json"
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
      - name: Real noVNC browser acceptance on the image being uploaded
        if: matrix.target == 'game-runtime'
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/desktop-deps" --no-save --ignore-scripts --no-audit --no-fund playwright@1.62.1 ws@8.22.0
          password="$RUNNER_TEMP/vnc-password"
          openssl rand -hex 4 > "$password"
          chmod 600 "$password"
          sudo chown 1000:1000 "$password"
          # Runner user still needs to read the password for the browser test.
          sudo cp "$password" "$RUNNER_TEMP/browser-password"
          sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/browser-password"
          trap 'docker logs sab-release-desktop || true; docker rm -f sab-release-desktop >/dev/null 2>&1 || true' EXIT
          docker run -d --name sab-release-desktop --user 1000:1000 --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true --tmpfs /tmp:rw,nosuid,nodev,mode=1777 --memory 512m --pids-limit 128 \
            --no-healthcheck -p 127.0.0.1:18680:6080 -e SAB_NOVNC_PORT=18680 \
            --mount "type=bind,source=$password,target=/run/secrets/sab_vnc_password,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/release-tools/tests/scripts/docker-desktop-entry.sh,target=/qa/entry.sh,readonly" \
            --entrypoint /bin/bash local/stardew-agent-bridge:game-runtime /qa/entry.sh
          for i in $(seq 1 40); do if curl -sf http://127.0.0.1:18680/vnc.html > /dev/null; then break; fi; sleep 0.5; done
          SAB_QA_DEPS="$RUNNER_TEMP/desktop-deps" SAB_QA_PASSWORD_FILE="$RUNNER_TEMP/browser-password" \
            SAB_CHROMIUM_EXECUTABLE="$(command -v google-chrome)" SAB_QA_OUTPUT="$RUNNER_TEMP/docker-desktop.json" \
            node release-tools/tests/scripts/docker-desktop-browser.mjs
      - name: Write public image provenance
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          const env = process.env;
          const raw = JSON.parse(fs.readFileSync(path.join(env.RUNNER_TEMP, 'image-inspect.json'), 'utf8'))[0];
          const labels = raw.Config.Labels;
          if (labels['org.opencontainers.image.revision'] !== env.SOURCE_COMMIT) throw new Error('Image source mismatch');
          const hash = crypto.createHash('sha256');
          for await (const chunk of fs.createReadStream(env.ARCHIVE)) hash.update(chunk);
          const result = { schemaVersion: 1, target: env.TARGET, sourceCommit: env.SOURCE_COMMIT,
            version: labels['org.opencontainers.image.version'], imageId: raw.Id, tags: raw.RepoTags,
            architecture: raw.Architecture, os: raw.Os, archive: path.basename(env.ARCHIVE),
            bytes: fs.statSync(env.ARCHIVE).size, sha256: hash.digest('hex'),
            workflowRun: `https://github.com/${env.GH_REPO}/actions/runs/${env.GITHUB_RUN_ID}` };
          const desktop = path.join(env.RUNNER_TEMP, 'docker-desktop.json');
          if (env.TARGET === 'game-runtime') {
            result.desktopValidation = JSON.parse(fs.readFileSync(desktop, 'utf8'));
            if (!result.desktopValidation.ok) throw new Error('Desktop acceptance failed');
            result.desktopTestCommit = env.GITHUB_SHA;
          }
          const output = path.join(env.RUNNER_TEMP, `DockerImage-${env.TARGET}.json`);
          fs.writeFileSync(output, JSON.stringify(result, null, 2) + '\n');
          fs.appendFileSync(env.GITHUB_ENV, `IMAGE_METADATA=${output}\n`);
          NODE
      - name: Upload to the existing draft only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases/$RELEASE_ID" | jq -e '.draft == true and .prerelease == true' > /dev/null
          gh release upload "$RELEASE_TAG" "$ARCHIVE" "$IMAGE_METADATA" --clobber
          # Deliberately no publish, tag, registry login, game input or save operations.
