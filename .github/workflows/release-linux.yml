name: Prepare Linux release asset
on:
  workflow_dispatch:
    inputs:
      release_id:
        description: 'Existing draft prerelease ID (never publishes it)'
        required: true
        type: string
      source_commit:
        description: 'Full release-source commit'
        required: true
        type: string
      mod_zip_sha256:
        description: 'SHA-256 of the uploaded standalone Mod ZIP'
        required: true
        type: string
permissions:
  contents: read
jobs:
  linux-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_ID: ${{ inputs.release_id }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      MOD_ZIP_SHA256: ${{ inputs.mod_zip_sha256 }}
    steps:
      - name: Validate draft and source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]
          [[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$MOD_ZIP_SHA256" =~ ^[a-f0-9]{64}$ ]]
          gh api "repos/$GH_REPO/releases/$RELEASE_ID" > "$RUNNER_TEMP/destination.json"
          jq -e '.draft == true and .prerelease == true' "$RUNNER_TEMP/destination.json" > /dev/null
          echo "RELEASE_TAG=$(jq -r .tag_name "$RUNNER_TEMP/destination.json")" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_commit }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Obtain only the publisher's verified Mod (no game references)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p 'require("./package.json").version')
          test "v$version" = "$RELEASE_TAG"
          filename="StardewAgentBridge-$version-mod.zip"
          gh release download "$RELEASE_TAG" --pattern "$filename" --dir "$RUNNER_TEMP/mod-input"
          printf '%s  %s\n' "$MOD_ZIP_SHA256" "$RUNNER_TEMP/mod-input/$filename" | sha256sum -c -
          mkdir -p artifacts/mod/StardewAgentBridge
          for file in StardewAgentBridge.dll manifest.json; do
            unzip -p "$RUNNER_TEMP/mod-input/$filename" "StardewAgentBridge/$file" > "artifacts/mod/StardewAgentBridge/$file"
            test -s "artifacts/mod/StardewAgentBridge/$file"
          done
          node -e 'const fs=require("fs");if(JSON.parse(fs.readFileSync("artifacts/mod/StardewAgentBridge/manifest.json")).Version!==require("./package.json").version)throw Error("Mod version mismatch")'
      - run: npm ci
      - run: npm run build
      - name: Obtain official bundled Node and verify its fixed hash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/runtime"
          cd "$RUNNER_TEMP/runtime"
          curl -fSL --retry 3 https://nodejs.org/dist/v22.13.0/node-v22.13.0-linux-x64.tar.xz -o node.tar.xz
          echo '3ff0d57063c33313d73d0bdcebc4c778ad6be948234584694a042c6fe57164f6  node.tar.xz' | sha256sum -c -
          tar -xf node.tar.xz
      - name: Build full package and run portable acceptance
        run: |
          set -euo pipefail
          npm run pack -- --target linux-x64 --runtime-root "$RUNNER_TEMP/runtime/node-v22.13.0-linux-x64" --verify --json
          version=$(node -p 'require("./package.json").version')
          archive="$RUNNER_TEMP/StardewAgentBridge-$version-linux-x64.tar.gz"
          tar -czf "$archive" -C release "StardewAgentBridge-$version-linux-x64"
          gzip -t "$archive"
          sha256sum "$archive"
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
      - name: Upload to the existing draft only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases/$RELEASE_ID" | jq -e '.draft == true and .prerelease == true' > /dev/null
          gh release upload "$RELEASE_TAG" "$ARCHIVE" --clobber
